<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>Muw API Dev</title>
    <meta name="title" content="Muw API Dev" />
    <meta
      name="description"
      content="An open AI API platform that better suits personal preferences."
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <!-- muw-owned: os-window boot spinner (self!==top); must stay AFTER #root -->
    <script>
      if (window.self !== window.top) {
        document.documentElement.classList.add('os-in-window')
        document.documentElement.style.background = 'transparent'
        document.body.style.background = 'transparent'
        var spinColor = '#888a'
        try {
          var _p = window.parent
          var _c = _p.getComputedStyle(_p.document.body).getPropertyValue('--primary')
          if (_c) spinColor = _c.trim()
        } catch (e) {}
        var _boot = document.createElement('div')
        _boot.id = 'boot-loading'
        _boot.innerHTML =
          '<style>#boot-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2147483647}#boot-loading svg{animation:boot-spin 0.9s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}</style>' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="' + spinColor + '" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity="0.15"/><path d="M21 12a9 9 0 0 0-9-9" stroke-opacity="0.75"/></svg>'
        document.body.appendChild(_boot)
        new MutationObserver(function (_m, obs) {
          var _r = document.getElementById('root')
          if (_r && _r.childElementCount > 0) {
            obs.disconnect()
            _boot.remove()
          }
        }).observe(document.getElementById('root'), { childList: true })
      }
    </script>
  </body>
</html>
