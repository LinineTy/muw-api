<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API | Muw Enhanced Edition</title>
    <meta name="title" content="New API | Muw Enhanced Edition" />
    <meta
      name="description"
      content="An open AI API platform that better suits personal preferences."
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <!-- OS 桌面壳窗口内文档(self!==top)的最早透明化:
         React mount 前该文档不知道自己在窗口里,会按主题闪纯色底
         (暗色琉璃=黑实底),与主层玻璃观感割裂。同步脚本先挂
         os-in-window(class 同名规则在 index.css)+内联透明,再在 root 内
         放一个纯 CSS spinner(透明底透出主层窗口玻璃,中性灰两主题可读),
         React createRoot 首次 render 会清空 root,spinner 自动消失,零清理。
         脚本必须在 root div 之后(getElementById 才拿得到)。
         muw 调整,上游同步留意。 -->
    <script>
      if (window.self !== window.top) {
        document.documentElement.classList.add('os-in-window')
        document.documentElement.style.background = 'transparent'
        document.body.style.background = 'transparent'
        // spinner 跟主题色:读主层(已渲染完)的 --primary 计算值,任何预设自动跟随
        var spinColor = '#888a'
        try {
          var _p = window.parent
          var _c = _p.getComputedStyle(_p.document.body).getPropertyValue('--primary')
          if (_c) spinColor = _c.trim()
        } catch (e) { /* 跨域兜底中性灰 */ }
        document.getElementById('root').innerHTML =
          '<style>#boot-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}#boot-loading svg{animation:boot-spin 0.9s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}</style>' +
          '<div id="boot-loading"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="' + spinColor + '" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity="0.15"/><path d="M21 12a9 9 0 0 0-9-9" stroke-opacity="0.75"/></svg></div>'
      }
    </script>
  </body>
</html>
